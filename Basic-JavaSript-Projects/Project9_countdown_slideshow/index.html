<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown & Slideshow Project</title>
    <!-- External CSS Stylesheet -->
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

    <!-- Countdown Section -->
    <div style="text-align: center; margin: 30px;">
        <h2>Countdown Timer</h2>
        <p>How many seconds would you like to set?</p>
        <input id="seconds" value="" />
        <button onclick="countdown()">Click here</button>
        <p id="timer" style="font-size: 24px; font-weight: bold;"></p>
    </div>

    <hr style="margin: 40px 0;">

    <!-- Slideshow Section -->
    <div style="text-align: center;">
        <h2>Automatic Slideshow</h2>
    </div>
    
    <div class="slideshow-container" style="text-align: center;">
        <!-- Full-width images with number and caption text -->
        <div class="mySlides fade">
            <div class="numbertext">1 / 3</div>
            <img src="images/car1.jpg">
            <div class="text">Classic Blue Shelby Cobra</div>
        </div>

        <div class="mySlides fade">
            <div class="numbertext">2 / 3</div>
            <img src="images/car2.jpg">
            <div class="text">Vintage Van Parked in the Sunlight</div>
        </div>

        <div class="mySlides fade">
            <div class="numbertext">3 / 3</div>
            <img src="images/car3.jpg">
            <div class="text">Open Road Ready</div>
        </div>
    </div>
    <br>

    <!-- The dots/circles -->
    <div style="text-align:center">
        <span class="dot"></span> 
        <span class="dot"></span> 
        <span class="dot"></span> 
    </div>

    <!-- External JavaScript File -->
    <script src="JS/main.js"></script>
</body>
</html>
