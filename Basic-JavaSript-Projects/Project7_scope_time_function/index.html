<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 7 - Scope, Time, and Functions</title>
</head>
<body>

    <h1>JavaScript Scope Assignment</h1>

    <!-- Paragraph with an id and onclick attribute -->
    <p id="Time_of_day" onclick="Time_function()">Click here to check the time!</p>
    <hr>

    <!-- 1. Paragraph providing instructions -->
    <p>Please enter your age below to see if you are old enough to vote:</p>

    <!-- 2. Input element with an id attribute -->
    <input id="ageInput" type="number" placeholder="Enter your age">

    <!-- 3. Button element with an onclick attribute referencing your function -->
    <button onclick="checkAge()">Submit</button>

    <!-- 4. Paragraph with an id attribute for output -->
    <p id="votingResult"></p>

    <!-- Link your JS file -->
    <script src="JS/main.js"></script>
</body>
</html>
